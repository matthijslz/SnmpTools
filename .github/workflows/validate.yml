name: Validate Module

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    strategy:
      matrix:
        edition:
          - powershell
          - pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Show PowerShell Version
        shell: ${{ matrix.edition }}
        run: |
          $PSVersionTable

      - name: Validate Manifest
        shell: ${{ matrix.edition }}
        run: |
          Test-ModuleManifest .\src\SnmpTools.psd1

      - name: Import Module
        shell: ${{ matrix.edition }}
        run: |
          Import-Module .\src\SnmpTools.psd1 -Force

      - name: Verify Exported Commands
        shell: ${{ matrix.edition }}
        run: |
          $manifest = Test-ModuleManifest .\src\SnmpTools.psd1

          $expected = $manifest.ExportedFunctions.Keys | Sort-Object
          $actual = (Get-Command -Module SnmpTools).Name | Sort-Object

          $difference = Compare-Object $expected $actual

          if ($difference) {
              Write-Host "Expected exports:"
              $expected

              Write-Host ""
              Write-Host "Actual exports:"
              $actual

              Write-Host ""
              Write-Host "Differences:"
              $difference | Format-Table | Out-String | Write-Host

              throw "Exported commands do not match manifest."
          }

          Write-Host "Export validation succeeded"