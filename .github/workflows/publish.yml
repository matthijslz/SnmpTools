name: Publish PowerShell Module

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Copy Documentation Files
        shell: pwsh
        run: |
          Copy-Item .\README.md .\src\
          Copy-Item .\LICENSE .\src\
          Copy-Item .\THIRD-PARTY-NOTICES.md .\src\

      - name: Validate Manifest
        shell: pwsh
        run: |
          Test-ModuleManifest .\src\SnmpTools.psd1

      - name: Validate Version
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest .\src\SnmpTools.psd1
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')

          if ($manifest.Version.ToString() -ne $tag) {
              throw "ModuleVersion '$($manifest.Version)' does not match release tag '$tag'"
          }

      - name: Import Module
        shell: pwsh
        run: |
          Import-Module .\src\SnmpTools.psd1 -Force

      - name: Verify PSGallery API Key
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
              throw "PSGALLERY_API_KEY secret is not configured."
          }

      - name: Publish Module
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $modulePath = (Resolve-Path .\src\SnmpTools.psd1).Path

          Publish-Module `
            -Path $modulePath `
            -Repository PSGallery `
            -NuGetApiKey $env:PSGALLERY_API_KEY `
            -Verbose
